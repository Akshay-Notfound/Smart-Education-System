<svg width="900" height="200" viewBox="0 0 900 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d18"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <style>
    @keyframes laserScan {
      0% { transform: translateY(0); opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { transform: translateY(200px); opacity: 0.2; }
    }
    @keyframes pulseText {
      0%, 100% { filter: drop-shadow(0 0 6px #6366f166); }
      50% { filter: drop-shadow(0 0 16px #6366f1cc); }
    }
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 900;
      letter-spacing: 5px;
      animation: pulseText 3.5s infinite ease-in-out;
    }
    .laser {
      animation: laserScan 4.5s infinite linear;
    }
  </style>

  <rect width="900" height="200" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="900" height="200" rx="12" fill="url(#grid)"/>

  <circle cx="200" cy="100" r="100" fill="#3b82f6" opacity="0.1" filter="url(#glow)"/>
  <circle cx="700" cy="100" r="100" fill="#ec4899" opacity="0.1" filter="url(#glow)"/>

  <line x1="30" y1="0" x2="870" y2="0" stroke="url(#laserGrad)" stroke-width="1.5" class="laser"/>
  <line x1="120" y1="1" x2="780" y2="1" stroke="url(#laserGrad)" stroke-width="2"/>
  <line x1="180" y1="199" x2="720" y2="199" stroke="url(#laserGrad)" stroke-width="1.5"/>

  <path d="M 16 30 L 16 16 L 30 16" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.8"/>
  <path d="M 884 30 L 884 16 L 870 16" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.8"/>
  <path d="M 16 170 L 16 184 L 30 184" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.8"/>
  <path d="M 884 170 L 884 184 L 870 184" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.8"/>

  <g transform="translate(450, 36)">
    <rect x="-140" y="-11" width="280" height="22" rx="4" fill="#0d1726" stroke="#6366f1" stroke-width="0.8"/>
    <circle cx="-120" cy="0" r="3" fill="#6366f1"/>
    <text x="-106" y="4" font-family="'Segoe UI', monospace" font-size="10" font-weight="700" fill="#6366f1" letter-spacing="2">EDTECH ECOSYSTEM // FLUTTER + FIREBASE</text>
  </g>

  <text x="450" y="98" text-anchor="middle" font-size="32" fill="url(#textGrad)" class="title">
    SMART EDUCATION SYSTEM
  </text>

  <text x="450" y="136" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#94a3b8" letter-spacing="2">
    NEXT-GEN ACADEMIC PORTAL & TRANSPARENT LEARNING
  </text>

  <text x="450" y="170" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="500" fill="#3b82f6" letter-spacing="1">
    ⚡ High-Precision Engineering  |  Interactive Architecture  |  Real-Time Performance ⚡
  </text>
</svg>